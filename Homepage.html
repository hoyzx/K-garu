<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: pink;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .gif-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .yes-btn {
            background-color: green;
            color: white;
        }

        .no-btn {
            background-color: red;
            color: white;
        }

        .hidden {
            display: none;
        }

        .question {
            font-size: 24px;
            margin-top: 20px;
        }

        .no-btn:disabled {
            background-color: gray;
            cursor: not-allowed;
        }

        .full-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background-color: pink;
            z-index: 999;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .fade {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

    </style>
</head>
<body>

    <div class="gif-container">
        <img id="initialGif" src="https://media.giphy.com/media/tpVKvAabWt3G5csMkT/giphy.gif" alt="Frog">
    </div>

    <div class="question">Will you be my Valentine?</div>

    <div class="buttons">
        <button id="yesBtn" class="yes-btn">Yes</button>
        <button id="noBtn" class="no-btn">No</button>
    </div>

    <div id="followUpQuestion" class="hidden">
        <div class="question" id="followUpText">Saxi vaneko ni</div>
    </div>

    <script>
        let yesButton = document.getElementById('yesBtn');
        let noButton = document.getElementById('noBtn');
        let followUpQuestion = document.getElementById('followUpQuestion');
        let followUpText = document.getElementById('followUpText');
        let initialGif = document.getElementById('initialGif');
        let body = document.body;

        let yesCount = 0;
        let noCount = 0;

        noButton.addEventListener('click', function () {
            // Increase the size of the Yes button when No is clicked
            yesButton.style.transform = `scale(${1.2 + (noCount * 0.2)})`;

            if (noCount === 0) {
                followUpText.innerText = "Saxi vaneko ni";
            } else if (noCount === 1) {
                followUpText.innerText = "Kasam saxi vaneko";
            } else if (noCount === 2) {
                followUpText.innerText = "Kasam ni?";
            } else if (noCount === 3) {
                followUpText.innerText = "I will give you a necklace worth 1 lakh!";
            } else if (noCount === 4) {
                followUpText.innerText = "You want to get married or something?";
            } else if (noCount >= 5) {
                // After the 5th click, hide the No button and display the final gif
                noButton.disabled = true;
                followUpText.innerText = "Please say Yes...";
                initialGif.src = "https://media.giphy.com/media/EQUQdq1Mr94PUJtANv/giphy.gif"; // Final gif
                yesButton.style.transition = 'transform 1s ease'; // Smooth animation
                yesButton.style.transform = "scale(5)"; // Make the Yes button full screen
                yesButton.classList.add('fade');
                setTimeout(() => {
                    noButton.classList.add('fade');
                    followUpQuestion.classList.add('fade');
                }, 300);
            }

            followUpQuestion.classList.remove('hidden');
            noCount++;
        });

        yesButton.addEventListener('click', function () {
            if (noCount >= 5) {
                body.innerHTML = `<div class="full-screen">Thank you bibisa🦆🥵</div>`; // Display final message
                yesButton.style.display = 'none'; // Hide the Yes button after the final click
                noButton.style.display = 'none'; // Hide the No button as well
            }
        });
    </script>

</body>
</html>
